name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"      # ogni lunedì

permissions:
  contents: read

jobs:
  analizza:
    name: CodeQL (${{ matrix.linguaggio }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguaggio: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.linguaggio }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.linguaggio }}"
