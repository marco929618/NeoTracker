name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # NOTE: the job names "Prove (Python …)" and "Analisi statica (bandit)" are referenced by the
  # branch protection rule on main (required status checks). Renaming them requires updating that rule.
  prove:
    name: Prove (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        run: python -m pip install --upgrade pip "pillow>=10.3.0"
      - name: Generated program is up to date (build.py)
        run: |
          python build.py
          git diff --exit-code -- neotracker.py
      - name: Syntax
        run: python -m py_compile neotracker.py melanoma_batch.py build.py tools/make_icon.py tools/traduzioni.py
      - name: Security tests
        run: python tests/test_sicurezza.py
      - name: Window life cycle
        run: python tests/test_finestra.py
      - name: Full backend test (mock services)
        run: python tests/test_api.py
      - name: Languages (complete translations, setting, page)
        run: python tests/test_i18n.py

  bandit:
    name: Analisi statica (bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install bandit
      - name: No medium or high severity issue
        run: bandit -q -r neotracker.py melanoma_batch.py -ll
